name: Build TabMaster Win7 x64

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-cross-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install MinGW-w64 & Windres Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 make

      - name: Compile Windows Resources (windres)
        run: |
          # Sprawdzamy czy katalog to src czy root
          SRCDIR="."
          if [ -d "src" ]; then
            SRCDIR="src"
          fi
          
          # Kompilacja zasobów .rc za pomocą x86_64-w64-mingw32-windres
          x86_64-w64-mingw32-windres -O coff "$SRCDIR/resource.rc" -o resource.o

      - name: Cross-Compile TabMaster.exe (Static MinGW-w64)
        run: |
          SRCDIR="."
          if [ -d "src" ]; then
            SRCDIR="src"
          fi

          # Dokładnie te same flagi, które miałeś w lokalnym skrypcie .bat, 
          # ale z użyciem linuksowego kompilatora x86_64-w64-mingw32-gcc
          x86_64-w64-mingw32-gcc -Os -s -Wall -Wextra -std=c99 -mwindows \
              -fno-ident -fno-asynchronous-unwind-tables \
              -ffunction-sections -fdata-sections \
              -I"$SRCDIR" \
              -o tabmaster.exe "$SRCDIR/main.c" resource.o \
              -Wl,--gc-sections -Wl,--subsystem,windows \
              -luser32 -lgdi32 -lpsapi -ldwmapi -lkernel32 -lshell32 -ladvapi32

      - name: Verify Executable Architecture
        run: |
          file tabmaster.exe

      - name: Package Release Artifact
        run: |
          mkdir -p dist
          cp tabmaster.exe dist/
          if [ -f "README.md" ]; then cp README.md dist/; fi
          if [ -f "LICENSE" ]; then cp LICENSE dist/; fi
          cd dist && zip -r TabMaster-Windows-x64.zip *

      - name: Upload Windows Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabMaster-Windows-x64
          path: |
            dist/tabmaster.exe
            dist/TabMaster-Windows-x64.zip
          retention-days: 14

  publish-release:
    name: Create GitHub Release & Upload Binaries
    needs: [build-cross-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: TabMaster-Windows-x64
          path: release-dist/

      - name: Determine Release Tag
        id: tag_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "name=TabMaster ${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.1.0" >> "$GITHUB_OUTPUT"
            echo "name=TabMaster v0.1.0-win7-x64" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.name }}
          body: |
            ### TabMaster Release (Windows 7 SP1 x64)
            Ultra-lightweight Win32 native Alt+Tab replacement & process killer.
            Built with cross-compiling MinGW-w64 (Zero bloat, < 2MB RAM footprint).
          draft: false
          prerelease: false
          files: |
            release-dist/tabmaster.exe
            release-dist/TabMaster-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}